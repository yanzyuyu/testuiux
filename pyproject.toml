[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testuiux"
version = "0.1.0"
authors = [
  { name="yanzyuyu", email="stockrii800@gmail.com" },
]
description = "Autonomous visual UI/UX defect detector and responsive layout verification engine powered by Playwright and Qwen2.5-VL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/yanzyuyu/testuiux"
Repository = "https://github.com/yanzyuyu/testuiux.git"
Issues = "https://github.com/yanzyuyu/testuiux/issues"

[project.scripts]
testuiux = "bughunter.cli:main"
bughunter = "bughunter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bughunter*", "testuiux*"]
